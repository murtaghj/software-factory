# CI for the software factory (W-002/AC-260). Mirrors scripts/ci.sh.
name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: docker.io/library/postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: factory_admin
          POSTGRES_PASSWORD: factory_admin_local
          POSTGRES_DB: factory
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U factory_admin -d factory" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm
      - run: sh scripts/ci.sh
