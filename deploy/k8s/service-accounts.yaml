# Two service accounts. The supervisor's account is the identity a pod's projected token names; it has no Role at all,
# so a token stolen from a pod can do nothing against the API server. Deployment invariant (S3, not enforced by the
# runner): only the runner's account and the Job controller create Jobs, pods and claims here, and nothing else may
# use `factory-allocation-supervisor`; conformance rows 13 and 15 assert it on the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-runner
  namespace: factory-exec-local
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: factory-allocation-supervisor
  namespace: factory-exec-local
automountServiceAccountToken: false
