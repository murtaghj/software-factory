# What the runner's process may do: exactly the calls of the KubeApi port, and no patch, exec, watch or collection delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-runner
  namespace: factory-exec-local
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-runner
  namespace: factory-exec-local
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: factory-runner }
subjects:
  - { kind: ServiceAccount, name: factory-runner, namespace: factory-exec-local }
---
# Cluster-scoped: token review, the storage class read at start, and the service-account key set that permit calls
# verify a pod's token against before the token is reviewed (a non-resource URL).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: factory-runner
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    resourceNames: ["local-path"]   # the configured workspace class only (RunnerConfig.storageClass)
    verbs: ["get"]
  - nonResourceURLs: ["/openid/v1/jwks"]
    verbs: ["get"]
  # W-019: the writer's node, by name, at a stop (a pod garbage-collected with its node is the hazard) and at a permit. `get` only: never list, patch or delete.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: factory-runner
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: factory-runner }
subjects:
  - { kind: ServiceAccount, name: factory-runner, namespace: factory-exec-local }
---
# W-019: the one Service the runner reads, in `default`: the API server's own cluster address, which the supervisor's network gate must list as a deny target.
# `resourceNames` names only that Service; the runner gains no right on ConfigMaps (the script holds the admin certificate and writes the CA ConfigMap).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factory-runner-api-service
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factory-runner-api-service
  namespace: default
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: factory-runner-api-service }
subjects:
  - { kind: ServiceAccount, name: factory-runner, namespace: factory-exec-local }
