# Local development services. Images are pinned by tag and digest (W-002).
name: software-factory
services:
  postgres:
    image: docker.io/library/postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: factory_admin
      POSTGRES_PASSWORD: factory_admin_local
      POSTGRES_DB: factory
    ports:
      - "127.0.0.1:55432:5432"
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_admin -d factory"]
      interval: 2s
      timeout: 3s
      retries: 30
  temporal:
    image: docker.io/temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--namespace", "factory", "--ui-port", "8233"]
    ports:
      - "127.0.0.1:57233:7233"
      - "127.0.0.1:58233:8233"
